name: Compilar APK GoldCast

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Clonar repositório GoldCast
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - name: 3. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: 4. Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Instalar Dependências do Projeto
        run: |
          npm install --legacy-peer-deps

      - name: 6. Gerar Projeto Nativo Android (Expo Prebuild)
        run: |
          npx expo prebuild --platform android --clean

      - name: 7. Integrar Just Player (Media3 & Native Player)
        run: |
          # 1. Adicionar dependências do Media3 / ExoPlayer no app/build.gradle
          sed -i '/dependencies {/a \    implementation "androidx.media3:media3-exoplayer:1.2.1"\n    implementation "androidx.media3:media3-ui:1.2.1"\n    implementation "androidx.media3:media3-datasource-okhttp:1.2.1"\n    implementation "androidx.media3:media3-session:1.2.1"' android/app/build.gradle

          # 2. Registar a atividade em tela cheia com orientação horizontal no AndroidManifest.xml
          sed -i '/<\/application>/i \    <activity android:name="com.goldcast.player.JustPlayerActivity" android:configChanges="keyboard|keyboardHidden|orientation|screenSize|screenLayout|smallestScreenSize|uiMode" android:screenOrientation="sensorLandscape" android:supportsPictureInPicture="true" android:theme="@style/Theme.AppCompat.NoActionBar.FullScreen" android:exported="true" />' android/app/src/main/AndroidManifest.xml

      - name: 8. Compilar APK Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 9. Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: GoldCast-JustPlayer-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

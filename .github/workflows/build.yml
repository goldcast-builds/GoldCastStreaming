name: Compilar APK GoldCast

on:
  workflow_dispatch: # Permite iniciar a compilação manualmente com um clique
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Clonar repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - name: 3. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: 4. Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Instalar Dependências do Projeto
        run: |
          npm install --legacy-peer-deps

      - name: 6. Gerar Projeto Nativo Android (Expo Prebuild)
        run: |
          npx expo prebuild --platform android --clean

      - name: 7. Compilar APK Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 8. Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: GoldCast-Player-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

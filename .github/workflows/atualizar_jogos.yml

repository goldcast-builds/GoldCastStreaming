name: Atualizar Jogos do Dia

on:
  schedule:
    # Executa diariamente às 06:00, 12:00 e 18:00 (Horário de Brasília)
    - cron: '0 9,15,21 * * *'
  workflow_dispatch: # Permite disparar manualmente pelo botão no GitHub

jobs:
  update-games:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Executar script dos jogos
        run: python scripts/update_jogos.py

      - name: Salvar atualizações no repositório
        run: |
          git config --global user.name "GoldCast Bot"
          git config --global user.email "bot@goldcast.app"
          git add frontend/src/data/jogos.json
          if git diff --staged --quiet; then
            echo "Nenhuma mudança nos jogos."
          else
            git commit -m "[bot] Atualizar jogos do dia"
            git push
          fi

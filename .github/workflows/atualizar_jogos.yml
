name: Atualizar Jogos do Dia

on:
  schedule:
    - cron: "0 9,15,21 * * *"
  workflow_dispatch:

jobs:
  update-games:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run script
        run: python scripts/update_jogos.py

      - name: Commit and push
        run: |
          git config --global user.name "GoldCast Bot"
          git config --global user.email "bot@goldcast.app"
          git add frontend/src/data/jogos.json
          git commit -m "[bot] Atualizar jogos do dia" || exit 0
          git push

name: Build Android APK (Expo)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Instalar dependências
        run: |
          cd frontend
          npm install

      - name: Gerar estrutura nativa Android (Expo Prebuild)
        run: |
          cd frontend
          npx expo prebuild --platform android --no-install

      - name: Injetar módulo nativo Just Player e dependências Media3
        run: |
          echo "===> A copiar ficheiros de android-custom..."
          if [ -d "android-custom" ]; then
            for f in $(find android-custom -name "*.java" -o -name "*.kt"); do
              PKG=$(grep -E "^package [a-zA-Z0-9_.]+" "$f" | head -n 1 | sed 's/package //; s/;//' | tr -d '\r\n ')
              if [ -n "$PKG" ]; then
                TARGET_DIR="frontend/android/app/src/main/java/$(echo "$PKG" | tr '.' '/')"
              else
                TARGET_DIR="frontend/android/app/src/main/java/com/goldcast/player"
              fi
              mkdir -p "$TARGET_DIR"
              cp "$f" "$TARGET_DIR/"
              echo "Copiado: $f -> $TARGET_DIR/"
            done

            if [ -d "android-custom/res" ]; then
              cp -rn android-custom/res/* frontend/android/app/src/main/res/ 2>/dev/null || true
            fi
          fi

          # Registar no MainApplication com Node.js de forma segura (sem mexer nos imports do topo)
          node -e '
            const fs = require("fs");
            const { execSync } = require("child_process");
            
            try {
              const mainAppPath = execSync("find frontend/android/app/src/main/java -name \"MainApplication.*\"")
                .toString().trim().split("\n")[0];
              
              if (mainAppPath && fs.existsSync(mainAppPath)) {
                console.log("A processar ficheiro:", mainAppPath);
                let content = fs.readFileSync(mainAppPath, "utf8");
                
                if (!content.includes("JustPlayerPackage")) {
                  if (content.includes(".apply {")) {
                    content = content.replace(".apply {", ".apply {\n              add(com.goldcast.player.JustPlayerPackage())");
                  } else if (content.includes("PackageList(this).packages")) {
                    content = content.replace(/(val packages = PackageList\(this\)\.packages.*)/, "$1\n          packages.add(com.goldcast.player.JustPlayerPackage())");
                  } else if (content.includes("new PackageList(this)")) {
                    content = content.replace(/new PackageList\(this\).*/, "$&\n      packages.add(new com.goldcast.player.JustPlayerPackage());");
                  }
                  fs.writeFileSync(mainAppPath, content, "utf8");
                  console.log("JustPlayerPackage registado com sucesso!");
                }
              }
            } catch (err) {
              console.error("Falha na injeção do MainApplication:", err);
            }
          '

          # Registar Activities no AndroidManifest.xml
          MANIFEST="frontend/android/app/src/main/AndroidManifest.xml"
          for act in $(find android-custom -name "*Activity.java" -o -name "*Activity.kt" 2>/dev/null); do
            ACT_NAME=$(basename "$act" | cut -d. -f1)
            if ! grep -q "$ACT_NAME" "$MANIFEST"; then
              ACT_PKG=$(grep -E "^package [a-zA-Z0-9_.]+" "$act" | head -n 1 | sed 's/package //; s/;//' | tr -d '\r\n ')
              sed -i "/<\/application>/i \        <activity android:name=\"$ACT_PKG.$ACT_NAME\" android:configChanges=\"keyboard|keyboardHidden|orientation|screenSize|screenLayout|smallestScreenSize|uiMode\" android:screenOrientation=\"sensorLandscape\" android:launchMode=\"singleTask\" android:theme=\"@style/Theme.AppCompat.NoActionBar\" android:exported=\"false\" \/>" "$MANIFEST"
              echo "Activity $ACT_NAME registada no AndroidManifest."
            fi
          done

          # Adicionar dependências Media3 ao app/build.gradle
          BUILD_GRADLE="frontend/android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ] && ! grep -q "media3-exoplayer" "$BUILD_GRADLE"; then
            sed -i '/dependencies {/a \    implementation "androidx.media3:media3-exoplayer:1.2.1"\n    implementation "androidx.media3:media3-ui:1.2.1"\n    implementation "androidx.media3:media3-exoplayer-hls:1.2.1"\n    implementation "androidx.media3:media3-exoplayer-dash:1.2.1"' "$BUILD_GRADLE"
            echo "Dependências Media3 adicionadas ao build.gradle."
          fi

      - name: Forçar permissão de HTTP no AndroidManifest
        run: |
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /g' frontend/android/app/src/main/AndroidManifest.xml
          grep -n "usesCleartextTraffic" frontend/android/app/src/main/AndroidManifest.xml

      - name: Dar permissão ao executável Gradle
        run: |
          chmod +x frontend/android/gradlew

      - name: Compilar APK (Release Standalone)
        run: |
          cd frontend/android
          ./gradlew assembleRelease \
            --no-daemon \
            --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" \
            -PreactNativeArchitectures=arm64-v8a

      - name: Disponibilizar APK para transferência
        uses: actions/upload-artifact@v4
        with:
          name: GoldCast-Release-APK
          path: frontend/android/app/build/outputs/apk/release/*.apk

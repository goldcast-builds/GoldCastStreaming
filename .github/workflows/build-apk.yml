name: Build Android APK (Expo)

on:
  push:
    branches: [ "main", "master", "tv" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Instalar dependências
        run: |
          cd frontend
          npm install

      - name: Gerar estrutura nativa Android (Expo Prebuild Limpo)
        run: |
          cd frontend
          npx expo prebuild --platform android --clean --no-install

      - name: Forçar permissão de HTTP no AndroidManifest
        run: |
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /g' frontend/android/app/src/main/AndroidManifest.xml
          grep -n "usesCleartextTraffic" frontend/android/app/src/main/AndroidManifest.xml

      - name: Dar permissão ao executável Gradle
        run: |
          chmod +x frontend/android/gradlew

      - name: Compilar APK Universal (32 bits + 64 bits)
        run: |
          cd frontend/android
          ./gradlew assembleRelease \
            --no-daemon \
            --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Disponibilizar APK para transferência
        uses: actions/upload-artifact@v4
        with:
          name: GoldCast-TV-Universal-APK
          path: frontend/android/app/build/outputs/apk/release/*.apk
